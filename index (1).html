<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>What's Your Website Mood?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&family=Caveat:wght@500;700&family=Shrikhand&family=Special+Elite&family=Barlow:wght@400;500;600;700&family=Gluten:wght@500;600;700&display=swap">
</head>
<body>
<style>
/* Layout: one paper card at a time on a soft moodboard desk; chapter ribbon on top, back/skip/next tucked under the card. Single, deliberately light paper look. */
:root{
  --desk:#FBF6EF;        /* cream paper */
  --card:#FFFDF9;        /* stationery */
  --blush:#F6D3D8;       /* blush pink */
  --lav:#DCD3F2;         /* lavender */
  --plum:#4A2E4F;        /* deep plum ink (contrast) */
  --berry:#B4436C;       /* accent */
  --ink:#2F2433;         /* text */
  --ink-soft:#76677A;
  --line:#EADFD6;
  --butter:#F7E3A6;
  --sage:#CFE0C8;
  --display:"Gloock", "Didot", "Bodoni 72", Georgia, serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand:"Caveat", "Bradley Hand", "Comic Sans MS", cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  background-image:radial-gradient(rgba(74,46,79,.07) 1px,transparent 1.2px);background-size:22px 22px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(40vmax 30vmax at 92% 8%, rgba(220,211,242,.55), transparent 70%),radial-gradient(38vmax 30vmax at 4% 96%, rgba(246,211,216,.6), transparent 70%)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--berry);outline-offset:3px;border-radius:6px}
.app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding-block:18px 48px;display:flex;flex-direction:column;gap:16px;min-height:100vh}

/* ribbon */
.ribbon{display:flex;flex-direction:column;gap:8px}
.ribbon[hidden]{display:none}
.ch-dots{display:flex;gap:6px;align-items:center}
.ch-dot{flex:1;height:8px;border-radius:99px;background:rgba(74,46,79,.1);position:relative;overflow:hidden}
.ch-dot i{position:absolute;inset:0;width:0;background:linear-gradient(90deg,var(--berry),#D9799B);border-radius:99px;transition:width .5s ease}
.ribbon-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.ribbon .chname{font-weight:700;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:var(--plum)}
.ribbon .cheer{font-family:var(--hand);font-size:1.3rem;color:var(--berry);line-height:1}

/* stage + card */
.stage{position:relative;flex:1}
.card{position:relative;background:var(--card);border-radius:26px;padding:clamp(22px,5vw,44px);border:1px solid var(--line);
  box-shadow:0 1px 0 #fff inset, 0 24px 50px -30px rgba(74,46,79,.45), 0 4px 0 rgba(74,46,79,.06);animation:cardin .5s cubic-bezier(.2,.8,.3,1) both}
.card.back{animation-name:cardinback}
@keyframes cardin{from{opacity:0;transform:translateY(18px) rotate(.6deg)}to{opacity:1;transform:none}}
@keyframes cardinback{from{opacity:0;transform:translateY(-14px) rotate(-.6deg)}to{opacity:1;transform:none}}
.tape{position:absolute;top:-13px;left:50%;width:120px;height:26px;margin-left:-60px;transform:rotate(-2deg);
  background:repeating-linear-gradient(45deg,rgba(220,211,242,.95) 0 8px,rgba(255,255,255,.9) 8px 16px);box-shadow:0 2px 4px rgba(74,46,79,.12)}
.qnum{font-family:"Special Elite", ui-monospace, monospace;font-size:.78rem;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase}
.q{margin:6px 0 4px;font-family:var(--display);font-weight:400;font-size:clamp(1.5rem,4.6vw,2.15rem);line-height:1.18;color:var(--plum);text-wrap:balance}
.hint{margin:0 0 18px;color:var(--ink-soft);font-size:.98rem;max-width:56ch}
.qblock + .qblock{margin-top:28px;padding-top:26px;border-top:1.5px dashed var(--line)}
.qblock .q.small{font-size:clamp(1.25rem,3.8vw,1.6rem)}

/* inputs */
.field{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;font-size:1.05rem;transition:border-color .2s, box-shadow .2s}
.field:focus{outline:none;border-color:var(--berry);box-shadow:0 0 0 4px rgba(180,67,108,.12)}
textarea.field{min-height:120px;resize:vertical;line-height:1.5}
.field::placeholder{color:#B4A8B6}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.three{grid-template-columns:1fr}}
.three .wrap{position:relative}
.three .wrap span{position:absolute;left:14px;top:-9px;background:var(--card);padding:0 6px;font-family:var(--hand);font-size:1.1rem;color:var(--berry);line-height:1}

.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.opts.big{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.opt{position:relative;display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;
  transition:transform .15s, border-color .2s, background .2s, box-shadow .2s;min-width:0}
.opt:hover{transform:translateY(-2px);border-color:#D9C2CF}
.opt .em{font-size:1.45rem;line-height:1;flex:0 0 auto}
.opt .t{font-weight:600;line-height:1.25}
.opt .s{display:block;font-weight:400;font-size:.85rem;color:var(--ink-soft)}
.opt[aria-pressed="true"]{background:#FDF0F4;border-color:var(--berry);box-shadow:0 4px 0 rgba(180,67,108,.18)}
.opt[aria-pressed="true"]::after{content:"✓";position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:var(--berry);color:#fff;font-size:.8rem;display:grid;place-items:center;font-weight:700;animation:pop .35s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.opt.tall{flex-direction:column;align-items:flex-start;gap:6px;padding:14px}
.opt.tall .em{font-size:1.9rem}
.opt .fs{display:block;margin-top:6px;font-size:1.35rem;line-height:1.15;color:var(--plum);font-weight:400}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:.95rem;display:inline-flex;align-items:center;gap:7px;transition:transform .15s, background .2s, border-color .2s}
.chip:hover{transform:translateY(-1px)}
.chip[aria-pressed="true"]{background:var(--plum);color:#fff;border-color:var(--plum)}
.chip .sw{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.chip.custom{border-style:dashed}
.chip .x{opacity:.7;margin-left:2px}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow .field{padding:10px 14px;font-size:.98rem}
.addrow button{flex:0 0 auto;border:none;background:var(--lav);color:var(--plum);font-weight:700;border-radius:14px;padding:0 16px}

/* moodboard cards */
.mood{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.mcard{border:1.5px solid var(--line);background:#fff;border-radius:18px;padding:8px;text-align:left;transition:transform .2s, border-color .2s, box-shadow .2s;position:relative;min-width:0}
.mcard:hover{transform:translateY(-3px) rotate(-.6deg)}
.mcard .board{display:block;position:relative;height:96px;border-radius:12px;overflow:hidden}
.mcard .board .p1,.mcard .board .p2,.mcard .board .p3{position:absolute;border-radius:6px}
.mcard .board .p1{left:8%;top:12%;width:44%;height:72%}
.mcard .board .p2{right:8%;top:10%;width:36%;height:38%}
.mcard .board .p3{right:12%;bottom:10%;width:30%;height:30%;border-radius:50%}
.mcard .board .word{position:absolute;left:12%;bottom:14%;font-size:1.25rem;line-height:1}
.mcard .lbl{display:block;font-weight:700;padding:8px 4px 2px;line-height:1.2}
.mcard .sub{display:block;font-size:.8rem;color:var(--ink-soft);padding:0 4px 4px}
.mcard[aria-pressed="true"]{border-color:var(--berry);box-shadow:0 5px 0 rgba(180,67,108,.2)}
.mcard[aria-pressed="true"]::after{content:"♥";position:absolute;top:-9px;right:-9px;width:28px;height:28px;border-radius:50%;background:var(--berry);color:#fff;display:grid;place-items:center;animation:pop .35s cubic-bezier(.3,1.7,.5,1)}

/* palettes */
.pals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pal{border:1.5px solid var(--line);background:#fff;border-radius:18px;padding:10px;text-align:left;transition:transform .2s, border-color .2s;min-width:0;position:relative}
.pal:hover{transform:translateY(-2px)}
.pal .sws{display:flex;height:54px;border-radius:12px;overflow:hidden}
.pal .sws i{flex:1}
.pal .lbl{display:block;font-weight:700;padding:8px 2px 0}
.pal[aria-pressed="true"]{border-color:var(--berry);box-shadow:0 5px 0 rgba(180,67,108,.2)}
.pal[aria-pressed="true"]::after{content:"✓";position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:var(--berry);color:#fff;font-size:.8rem;display:grid;place-items:center;font-weight:700}
.mypal{margin-top:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mypal .lab{font-family:var(--hand);font-size:1.3rem;color:var(--berry)}
.mypal input[type=color]{width:46px;height:46px;border:2px solid #fff;border-radius:50%;padding:0;box-shadow:0 0 0 1.5px var(--line);background:none;cursor:pointer}
.mypal input[type=color]::-webkit-color-swatch-wrapper{padding:0}.mypal input[type=color]::-webkit-color-swatch{border:none;border-radius:50%}
.mypal .clr{border:none;background:none;color:var(--ink-soft);text-decoration:underline;font-size:.9rem}

/* slider */
.scale{padding:8px 4px 0}
.scale input{width:100%;accent-color:var(--berry);height:28px}
.scale .ends{display:flex;justify-content:space-between;gap:12px;font-weight:600;color:var(--plum);font-size:.95rem}
.scale .now{margin-top:14px;text-align:center;font-family:var(--hand);font-size:1.6rem;color:var(--berry);min-height:2rem}

/* uploads */
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed #DCC7D3;border-radius:18px;padding:22px;text-align:center;background:rgba(255,255,255,.6);cursor:pointer;transition:background .2s, border-color .2s}
.drop:hover,.drop.over{background:#FDF0F4;border-color:var(--berry)}
.drop b{color:var(--plum)}
.drop small{color:var(--ink-soft)}
.thumbs{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.polaroid{position:relative;background:#fff;padding:6px 6px 22px;box-shadow:0 8px 16px -10px rgba(0,0,0,.45);width:110px;transform:rotate(var(--r,-2deg))}
.polaroid img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.polaroid button{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;border:none;background:var(--plum);color:#fff;font-size:.8rem}

/* reaction bubble */
.react{position:absolute;right:clamp(14px,4vw,30px);top:-18px;background:var(--plum);color:#fff;font-family:var(--hand);font-size:1.25rem;padding:6px 14px;border-radius:16px 16px 4px 16px;
  box-shadow:0 8px 18px -8px rgba(74,46,79,.6);animation:bubble 2.4s ease both;pointer-events:none;white-space:nowrap;z-index:3}
@keyframes bubble{0%{opacity:0;transform:translateY(8px) scale(.8)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}

/* nav */
.nav{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-top:22px;flex-wrap:wrap}
.nav .right{display:flex;gap:10px;margin-left:auto;align-items:center}
.btn{border:none;border-radius:999px;padding:13px 24px;font-weight:700;font-size:1rem;background:var(--plum);color:#fff;box-shadow:0 4px 0 #2b1a2f;transition:transform .12s, box-shadow .12s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2b1a2f}
.btn.pink{background:var(--berry);box-shadow:0 4px 0 #7f2a4a}
.btn.pink:active{box-shadow:0 1px 0 #7f2a4a}
.btn.soft{background:#fff;color:var(--plum);box-shadow:0 0 0 1.5px var(--line), 0 4px 0 var(--line)}
.btn[disabled]{opacity:.5;cursor:default}
.link{background:none;border:none;color:var(--ink-soft);font-weight:600;padding:10px 6px;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--plum)}
.need{color:var(--berry);font-size:.92rem;margin:10px 0 0;font-weight:600}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

/* cover */
.cover{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(18px,4vw,40px);align-items:center;padding-block:clamp(10px,4vh,40px)}
@media (max-width:680px){.cover{grid-template-columns:1fr}}
.cover h1{margin:0;font-family:"Shrikhand", var(--display);font-weight:400;font-size:clamp(2.6rem,8vw,4.4rem);line-height:.98;color:var(--plum);letter-spacing:-.01em;text-wrap:balance}
.cover h1 em{font-style:normal;color:var(--berry);display:inline-block;transform:rotate(-3deg)}
.cover .sub{font-size:1.12rem;color:var(--ink);max-width:40ch;margin:16px 0 0}
.cover .note{display:inline-block;margin-top:18px;font-family:var(--hand);font-size:1.45rem;color:var(--berry);transform:rotate(-2deg);background:var(--butter);padding:4px 14px 6px;box-shadow:0 6px 12px -8px rgba(0,0,0,.35)}
.cover .go{margin-top:26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cover .eta{color:var(--ink-soft);font-size:.92rem}
.resume{margin-top:12px}
.board-col{position:relative;height:clamp(280px,40vw,380px)}
@media (max-width:680px){.board-col{height:260px;order:-1}}
.pol{position:absolute;background:#fff;padding:8px 8px 30px;box-shadow:0 14px 26px -16px rgba(74,46,79,.55);width:46%;transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
.pol .pic{aspect-ratio:1;border-radius:2px;display:grid;place-items:center}
.pol .pic svg{width:62%;height:auto}
.pol figcaption{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-family:var(--hand);font-size:1.15rem;color:var(--plum)}
.pol.a{left:4%;top:6%;transform:rotate(-7deg)}.pol.b{right:2%;top:0;transform:rotate(6deg)}.pol.c{left:24%;bottom:0;transform:rotate(-1deg)}
.board-col:hover .pol.a{transform:rotate(-10deg) translateY(-4px)}.board-col:hover .pol.b{transform:rotate(9deg) translateY(-4px)}.board-col:hover .pol.c{transform:rotate(2deg) translateY(-6px)}
.sticker{position:absolute;right:6%;bottom:12%;width:84px;height:84px;border-radius:50%;background:var(--lav);display:grid;place-items:center;text-align:center;font-family:var(--hand);font-size:1.05rem;color:var(--plum);line-height:1;transform:rotate(12deg);box-shadow:0 8px 14px -8px rgba(74,46,79,.5);animation:wob 4s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(4deg) translateY(-4px)}}
.washi{position:absolute;width:70px;height:20px;background:repeating-linear-gradient(90deg,rgba(246,211,216,.95) 0 6px,rgba(255,255,255,.85) 6px 12px);z-index:2}

/* chapter cover */
.chap{text-align:center;padding-block:clamp(26px,6vh,56px)}
.chap .big{font-size:3.4rem;line-height:1;display:block;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.chap .num{font-family:"Special Elite", ui-monospace, monospace;letter-spacing:.2em;color:var(--ink-soft);font-size:.85rem;margin-top:16px;display:block}
.chap h2{margin:6px 0 10px;font-family:var(--display);font-weight:400;font-size:clamp(2rem,6vw,3rem);color:var(--plum);line-height:1.08;text-wrap:balance}
.chap p{margin:0 auto;max-width:42ch;color:var(--ink-soft);font-size:1.05rem}
.chap .nav{justify-content:center}
.chap .nav .right{margin-left:0}

/* review */
.rv-ch{margin-top:22px}
.rv-ch h3{margin:0 0 8px;font-family:var(--display);font-weight:400;font-size:1.4rem;color:var(--plum)}
.rv-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-top:1px dashed var(--line)}
.rv-item .rq{font-size:.88rem;color:var(--ink-soft);font-weight:600}
.rv-item .ra{grid-column:1;overflow-wrap:anywhere}
.rv-item .ra.skip{color:#B4A8B6;font-style:italic}
.rv-item .edit{grid-row:1 / span 2;grid-column:2;align-self:center}
.sw-inline{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px}
.sw-inline i{width:16px;height:16px;border-radius:4px;display:block;border:1px solid rgba(0,0,0,.08)}

/* done */
.done h2{font-family:"Shrikhand", var(--display);font-weight:400;color:var(--plum);font-size:clamp(2rem,6vw,2.8rem);line-height:1.05;margin:4px 0 12px;text-wrap:balance}
.done .lead{font-size:1.12rem;max-width:48ch}
.sendbox{margin-top:24px;background:#FBF3FA;border:1.5px solid #E9DDF0;border-radius:20px;padding:18px}
.sendbox h3{margin:0 0 4px;font-size:1.05rem}
.sendbox p{margin:0 0 12px;color:var(--ink-soft);font-size:.95rem}
.code{width:100%;font-family:ui-monospace, "SF Mono", Menlo, monospace;font-size:.78rem;line-height:1.45;border-radius:12px;border:1.5px solid var(--line);padding:10px;background:#fff;height:88px;resize:none;color:var(--ink-soft);overflow-wrap:anywhere}
.sendrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.sendrow a.btn{text-decoration:none;display:inline-flex;align-items:center}
.ok{font-weight:700;color:#3E7A4F;font-size:.92rem;align-self:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall var(--d) linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}

.studio-chip{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;border:none;background:var(--plum);color:#fff;border-radius:999px;padding:10px 16px;font-weight:700;box-shadow:0 6px 16px -6px rgba(74,46,79,.6);text-decoration:none}

/* ---------- studio ---------- */
.studio{max-width:1180px}
.st-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.st-head h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,4vw,2.4rem);color:var(--plum);line-height:1.1}
.st-head .tag{font-family:var(--hand);font-size:1.3rem;color:var(--berry)}
.st-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.st-grid{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 18px 40px -32px rgba(74,46,79,.5)}
.panel h2{margin:0 0 10px;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.panel + .panel{margin-top:16px}
.paste{width:100%;min-height:96px;font-family:ui-monospace, Menlo, monospace;font-size:.78rem}
.st-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.btn.sm{padding:9px 16px;font-size:.9rem}
.err{color:#A3263E;font-size:.9rem;margin:8px 0 0}
.muted{color:var(--ink-soft);font-size:.9rem}
.clients{display:flex;flex-direction:column;gap:8px}
.client{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px}
.client[aria-current="true"]{border-color:var(--berry);background:#FDF0F4}
.client .av{width:34px;height:34px;border-radius:50%;background:var(--lav);display:grid;place-items:center;font-weight:700;color:var(--plum);flex:0 0 auto}
.client .nm{font-weight:700;line-height:1.2;display:block}
.client .dt{font-size:.8rem;color:var(--ink-soft)}
.pill{margin-left:auto;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:3px 9px;background:#F1ECE6;color:var(--ink-soft);flex:0 0 auto}
.pill.ok{background:#DDEFD9;color:#3E7A4F}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;font-weight:700}
.tab[aria-selected="true"]{background:var(--plum);color:#fff;border-color:var(--plum)}
.empty{text-align:center;padding:40px 16px;color:var(--ink-soft)}
.empty b{display:block;font-family:var(--display);font-weight:400;font-size:1.5rem;color:var(--plum);margin-bottom:6px}

.brief .hero{border-radius:18px;padding:22px;background:linear-gradient(135deg,#FDF0F4,#F1ECFA)}
.brief .hero .who{font-family:var(--display);font-size:2rem;color:var(--plum);line-height:1.1;margin:0}
.brief .adj{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.brief .adj span{background:#fff;border-radius:99px;padding:6px 14px;font-weight:700;color:var(--berry);box-shadow:0 2px 0 rgba(180,67,108,.15)}
.brief .palette{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:16px}
.brief .palette div{background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.brief .palette i{display:block;height:58px}
.brief .palette span{display:block;padding:6px 10px;font-size:.8rem;line-height:1.3}
.brief .palette b{display:block;font-size:.85rem}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:16px 0 4px;font-size:.85rem;color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.sec{margin-top:18px;padding-top:16px;border-top:1.5px dashed var(--line)}
.sec h3{margin:0 0 10px;font-family:var(--display);font-weight:400;font-size:1.35rem;color:var(--plum)}
.sec .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px}
@media (max-width:640px){.sec .cols{grid-template-columns:1fr}}
.said{background:#F7F4EF;border-left:4px solid #CDBBA7;border-radius:4px 12px 12px 4px;padding:10px 14px}
.said h4,.read h4{margin:0 0 6px;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.said ul{margin:0;padding-left:18px}
.said li{margin:2px 0}
.read{background:#F4F0FB;border-left:4px solid #A897D6;border-radius:4px 12px 12px 4px;padding:10px 14px}
.read p{margin:0}
.read ul{margin:8px 0 0;padding-left:18px}
.concepts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.concept{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px}
.concept b{display:block;font-family:var(--display);font-weight:400;font-size:1.2rem;color:var(--plum)}
.concept p{margin:6px 0 0;font-size:.95rem}
.concept small{display:block;margin-top:8px;color:var(--berry);font-weight:600}
.surprise{background:var(--butter);border-radius:16px;padding:16px;transform:rotate(-.4deg)}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 10px;text-align:center}
.loading .dots{display:flex;gap:8px}
.loading .dots i{width:12px;height:12px;border-radius:50%;background:var(--berry);animation:bob 1s ease-in-out infinite}
.loading .dots i:nth-child(2){animation-delay:.15s;background:#A897D6}.loading .dots i:nth-child(3){animation-delay:.3s;background:var(--plum)}
@keyframes bob{50%{transform:translateY(-10px)}}
.ans-ch{margin-top:16px}
.ans-ch h3{margin:0 0 6px;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--berry)}
.ans{padding:8px 0;border-top:1px dashed var(--line)}
.ans .aq{font-size:.85rem;color:var(--ink-soft);font-weight:600}
.ans .aa{overflow-wrap:anywhere}
.ans .aa.skip{color:#B4A8B6;font-style:italic}
.ans img{width:90px;height:90px;object-fit:cover;border-radius:8px;margin:4px 6px 0 0}

.addrow button{background:var(--lav);color:var(--plum)}
.react{background:var(--berry);font-family:var(--hand);font-weight:600;box-shadow:0 6px 0 var(--pinkdeep)}
.btn{background:var(--berry);color:#fff;box-shadow:0 5px 0 var(--ink);font-family:var(--body);font-weight:700;letter-spacing:.02em}

.btn.pink{background:var(--berry);box-shadow:0 5px 0 var(--ink)}

.link{color:var(--plum)}
.need{color:var(--pinkdeep)}
/* ribbon on blue */
.ribbon .chname{color:#fff}
.ribbon .cheer{font-family:var(--hand);font-weight:600;font-size:1.2rem;color:var(--blush)}
.ch-dot{background:rgba(255,255,255,.22)}
.ch-dot i{background:linear-gradient(90deg,var(--berry),#FF8BC9)}

.chap h2{font-family:var(--display);color:var(--plum);font-size:clamp(1.9rem,5.6vw,2.8rem)}
.chap .num{font-family:var(--body);font-weight:700;color:var(--berry)}
/* review + done */
.rv-ch h3{font-family:var(--hand);font-weight:700;color:var(--plum)}
.done h2{font-family:var(--display);color:var(--plum)}
.sendbox{background:#F4F2FF;border:2px solid var(--line)}
/* studio on blue */
.st-head h1{color:#fff;font-family:var(--display)}
.st-head .tag{color:var(--blush);font-family:var(--hand);font-weight:600}
.st-head .link{color:#fff}
.panel{border:none;box-shadow:0 6px 0 rgba(20,10,110,.35)}
#detail .st-head h1{color:var(--plum)}
#detail .st-head .tag{color:var(--berry)}
.studio-chip{background:var(--berry);box-shadow:0 4px 0 var(--ink)}

    .replace(/\{them\}/g, them || "them").replace(/\{you\}/g, you || "friend");
}

function addRow(el, ph, onAdd){
  const r = document.createElement("div"); r.className = "addrow";

  const doAdd = () => { const v = i.value.trim(); if (v) { onAdd(v); i.value = ""; i.focus(); } };
  b.onclick = doAdd; i.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); doAdd(); } });
  el.appendChild(r);
}
function shrink(file, max){
  return new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", .82));
    }; img.onerror = () => res(fr.result); img.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

/* ---------- formatting answers (shared by review + studio) ---------- */
function fmtHTML(q, v){
  if (isEmpty(v)) return null;
  if (q.type === "three") return esc(v.filter(x => x && x.trim()).join(" · "));
  if (q.type === "scale") return esc(`${v}/5 · ${q.steps[v-1]}`);
  if (q.type === "palette"){
    const parts = [];
    (v.picks || []).forEach(n => { const p = PALETTES.find(x => x.name === n); parts.push(`<span class="sw-inline">${(p ? p.c : []).map(c => `<i style="background:${c}"></i>`).join("")}</span>${esc(n)}`); });
    const cu = (v.custom || []).filter(Boolean); if (cu.length) parts.push(`<span class="sw-inline">${cu.map(c => `<i style="background:${c}"></i>`).join("")}</span>Their own: ${esc(cu.join(", "))}`);
    return parts.join("<br>");
  }
  if (q.type === "colors") return v.map(n => { const f = COLORS.find(c => c[0] === n); return `${f ? `<span class="sw-inline"><i style="background:${f[1]}"></i></span>` : ""}${esc(n)}`; }).join(" &nbsp; ");
  if (q.type === "date"){ const d = new Date(v + "T00:00"); return esc(isNaN(d) ? v : d.toLocaleDateString(undefined, { day:"numeric", month:"long", year:"numeric" })); }
  if (q.type === "upload") return esc(`${v.length} photo${v.length === 1 ? "" : "s"}: ${v.join(", ")}`);
  if (Array.isArray(v)) return esc(v.join(", "));
  return esc(v).replace(/\n/g, "<br>");
}
function fmtText(q, v){
  if (isEmpty(v)) return null;
  if (q.type === "three") return v.filter(x => x && x.trim()).join(", ");
  if (q.type === "scale") return `${v}/5 (1 = ${q.ends[0].replace(/^\S+\s/,"")}, 5 = ${q.ends[1].replace(/\s\S+$/,"")}): "${q.steps[v-1]}"`;
  if (q.type === "palette"){
    const out = (v.picks || []).map(n => { const p = PALETTES.find(x => x.name === n); return `${n} (${p ? p.c.join(" ") : ""})`; });
    const cu = (v.custom || []).filter(Boolean); if (cu.length) out.push(`their own colours: ${cu.join(" ")}`);
    return out.join("; ");
  }
  if (q.type === "colors") return v.map(n => { const f = COLORS.find(c => c[0] === n); return f ? `${n} (${f[1]})` : n; }).join(", ");
  if (q.type === "upload") return `${v.length} photo(s) shared: ${v.join(", ")}`;
  if (Array.isArray(v)) return v.join(", ");
  return String(v);
}

/* ---------- payload + answer code ---------- */
function buildPayload(withImages){
  const answers = {};
  SCREENS_DEF.forEach(s => s.qs.forEach(q => {
    const a = state.answers[q.id];
    answers[q.id] = { chapter: CHAPTERS.find(c => c.id === q.ch).title, question: fill(q.q), type: q.type, answer: a && !a.skipped && !isEmpty(a.v) ? a.v : null, skipped: !a || a.skipped || isEmpty(a.v) };
    if (withImages && images[q.id] && images[q.id].length) answers[q.id].images = images[q.id].map(x => ({ name:x.name, dataUrl:x.dataUrl }));
  }));
  return { form:"lets-get-a-little-personal-gift", version:2, name: nameOf() || null, recipient: recipOf() || null, startedAt: state.startedAt, submittedAt: state.submittedAt || new Date().toISOString(), answers };
}
function b64url(bytes){ let s = ""; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function unb64url(s){ s = s.replace(/-/g,"+").replace(/_/g,"/"); while (s.length % 4) s += "="; const bin = atob(s); return Uint8Array.from(bin, c => c.charCodeAt(0)); }
function compact(p){
  const a = {}; Object.entries(p.answers).forEach(([id,x]) => { if (!x.skipped && !isEmpty(x.answer)) a[id] = x.answer; });
  return { f:2, n:p.name, r:p.recipient, s:p.startedAt, t:p.submittedAt, a };
}
function expand(c){
  if (!c || (c.f !== 1 && c.f !== 2)) return c;
  const answers = {};
  SCREENS_DEF.forEach(s => s.qs.forEach(q => {
    const v = c.a[q.id];
    answers[q.id] = { chapter: CHAPTERS.find(k => k.id === q.ch).title, question: fillWith(q.q, c.n, c.r), type:q.type, answer: v === undefined ? null : v, skipped: v === undefined };
  }));
  return { form:"lets-get-a-little-personal-gift", version:2, name:c.n || null, recipient:c.r || null, startedAt:c.s || null, submittedAt:c.t || null, answers };
}
async function encodeCode(obj){
  const raw = new TextEncoder().encode(JSON.stringify(compact(obj)));
  try {
    const cs = new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate-raw"));
    return "LGP1." + b64url(new Uint8Array(await new Response(cs).arrayBuffer()));
  } catch(e){ return "LGP0." + b64url(raw); }
}
async function decodeCode(code){
  const m = String(code).match(/LGP([01])\.([A-Za-z0-9_-]+)/);
  if (!m) throw new Error("no-code");
  let bytes = unb64url(m[2]);
  if (m[1] === "1"){ const ds = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw")); bytes = new Uint8Array(await new Response(ds).arrayBuffer()); }
  return expand(JSON.parse(new TextDecoder().decode(bytes)));
}

   STUDIO (designer only, at #studio)
   ========================================================================= */
let ST = { db:null, user:null, sample:null, downloads:null, clients:[], current:null, tab:"brief", busy:false, unsub:null };
const BRIEF_SECTIONS = [
  ["snapshot","The Person & The Occasion"],["vibe","Their Vibe & Aesthetic"],["interests","Their Interests & References"],
  ["visual","Visual Identity"],["experience","The Experience"],["feeling","The Feeling to Create"],
  ["elements","Personalised Elements"],["avoid","Things to Avoid"],["assets","Assets to Collect"],["direction","Creative Direction"]
];
function answersForPrompt(p){
  const out = [];
  Object.entries(p.answers || {}).forEach(([id,a]) => {
    const q = QBY[id]; if (!a || a.skipped || isEmpty(a.answer)) return;
    out.push({ id, chapter:a.chapter, question:a.question, answer: q ? fmtText(q, a.answer) : (typeof a.answer === "string" ? a.answer : JSON.stringify(a.answer)) });
  });
  return out;
}
function briefPrompt(p){
  return `You are the creative director of a small studio that builds personalised websites as gifts (birthdays, anniversaries, surprises). Someone ordering a gift website filled in a 20-question discovery questionnaire about the person it is for. Their answers describe the recipient as the gifter sees them, plus the gifter's wishes for the website. Write the INTERNAL creative brief for the designer (the customer never sees it).

Rules:
- Never invent personal facts about the recipient or the gifter. "said" lists only what the customer actually wrote or selected, tightly paraphrased or quoted, each ending with the question id in square brackets, e.g. "Picked Dreamy and aesthetic and Vintage and retro [vibe]".
- Everything you interpret goes in "read", phrased as interpretation ("This suggests…", "Likely…"). Where answers are thin, say so plainly and note what to ask the customer, instead of guessing.
- Ground colours and type in what they chose; respect every colour, style or trend they said they dislike.
- Be specific and usable: name real interaction ideas, copy tone examples, section names, doodle motifs. Avoid generic filler.
- Use British/Indian English spelling.

Return ONLY JSON with exactly this shape:
{
  "adjectives": ["three", "vibe", "adjectives"],
  "sections": [
    { "key": "snapshot|vibe|interests|visual|experience|feeling|elements|avoid|assets|direction", "said": ["…"], "read": "2-4 sentences", "ideas": ["optional concrete bullets"] }
  ],
  "palette": [ { "name": "", "hex": "#RRGGBB", "role": "background|surface|text|accent|highlight" } ],
  "typography": { "display": "a Google Font", "body": "a Google Font", "accent": "optional handwritten or mono Google Font", "why": "one sentence" },
  "concepts": [ { "name": "", "pitch": "2 sentences", "signature_moment": "the one interaction the recipient will remember" } ],
  "unexpected": { "idea": "", "why": "which answers it grows from" }
}
Include all ten sections in this order: snapshot (who the recipient seems to be and the occasion), vibe, interests, visual, experience (structure, aesthetic vs interactive balance, features), feeling (the emotional goal), elements (5-8 specific personalised animations, sections or surprises, each tied to an answer), avoid, assets (photos, songs and other material to request from the customer, and what's already been promised), direction (a concise brief the designer can start building from). Give 5-6 palette colours and exactly 3 concepts.

Ordered by: ${p.name || "(not given)"}
Website for: ${p.recipient || "(not given)"}
Answers (skipped questions are left out):
${JSON.stringify(answersForPrompt(p), null, 1)}`;
}
async function studioInit(){
  document.title = "Studio · What's Your Website Mood?";
  $("#ribbon").hidden = true;
  const stage = $("#stage"); $("#app").classList.add("studio");
  stage.innerHTML = `<div class="loading"><div class="dots"><i></i><i></i><i></i></div><span class="muted">Opening your studio…</span></div>`;
  const use = n => (window.claude && claude.use ? claude.use(n).catch(() => null) : Promise.resolve(null));
  ST.user = await use("user");
  let allowed = false;
  try { allowed = ST.user ? ((await ST.user.isOwner()) || (await ST.user.canEdit())) : false; } catch(e){}
  if (!allowed){
    stage.innerHTML = `<section class="card"><span class="tape"></span><h2 class="q">This corner is for the designer 🎨</h2><p class="hint">If you're here to fill in the questionnaire, head back to the start.</p><a class="btn pink" href="#" id="home" style="text-decoration:none;display:inline-block">Take me to the questions →</a></section>`;
    $("#home").onclick = e => { e.preventDefault(); location.hash = ""; };
    return;
  }
  [ST.db, ST.sample, ST.downloads] = await Promise.all([use("db"), use("sample"), use("downloads")]);
  stage.innerHTML = `
    <div class="st-head"><div><span class="tag">for your eyes only</span><h1>Your Studio</h1></div>
      <a class="link" href="#" id="toQuiz">Preview the questionnaire →</a></div>
    <div class="st-grid" style="margin-top:16px">
      <aside>
        <div class="panel">
          <h2>Add a response</h2>
          <textarea class="field paste" id="pasteCode" placeholder="Paste the WhatsApp message or answer code here (it starts with LGP1.)"></textarea>
          <div class="st-actions"><button class="btn sm" id="openCode">Open answers</button>
            <label class="link" style="cursor:pointer">or upload a .json<input type="file" id="jsonFile" accept=".json,application/json" hidden></label></div>
          <p class="err" id="pasteErr" hidden></p>
        </div>
        <div class="panel">
          <h2>Clients</h2>
          <div class="clients" id="clients"><p class="muted">${ST.db ? "No responses yet. Paste a code above to add your first client." : "Your client library isn't available in this view, so open this page in claude.ai to keep responses. You can still open codes and make briefs here."}</p></div>
        </div>
      </aside>
      <section class="panel" id="detail"><div class="empty"><b>Pick a client, or paste a code</b>Their answers and the creative brief will show up here.</div></section>
    </div>`;
  $("#toQuiz").onclick = e => { e.preventDefault(); location.hash = ""; };
  $("#openCode").onclick = async () => {
    const err = $("#pasteErr"); err.hidden = true;
    try { const p = await decodeCode($("#pasteCode").value.trim()); await addClient(p); $("#pasteCode").value = ""; }
    catch(e){ err.textContent = "That doesn't look like an answer code. Paste the whole message: the code starts with LGP1. or LGP0."; err.hidden = false; }
  };
  $("#jsonFile").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    const err = $("#pasteErr"); err.hidden = true;
    try { const p = JSON.parse(await f.text()); if (!p.answers) throw 0; await addClient(p); }
    catch(x){ err.textContent = "That file isn't a saved answers file."; err.hidden = false; }
    e.target.value = "";
  };
  if (ST.db){
    const t = setTimeout(() => { if (!ST.clients.length) drawClients(); }, 10000);
    ST.unsub = ST.db.collection("clients").orderBy("receivedAt","desc").onSnapshot(snap => {
      clearTimeout(t);
      ST.clients = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      if (ST.current){ const fresh = ST.clients.find(c => c.id === ST.current.id); if (fresh && !ST.busy) ST.current = fresh; }
      drawClients(); if (ST.current) drawDetail();
    }, () => { clearTimeout(t); $("#clients").innerHTML = `<p class="err">Couldn't load your client library right now.</p>`; });
  }
}
function stripImages(p){ const q = JSON.parse(JSON.stringify(p)); Object.values(q.answers || {}).forEach(a => { if (a && a.images) delete a.images; }); return q; }
function clientName(p){ return p.recipient ? `For ${p.recipient}` + (p.name ? ` · from ${p.name}` : "") : (p.name || "Unnamed client"); }
function slugId(p){ return ((p.recipient || p.name || "client").toLowerCase().replace(/[^\w]+/g,"-").replace(/^-|-$/g,"") || "client") + "-" + (Date.parse(p.submittedAt || "") || Date.now()).toString(36); }
async function addClient(p){
  const id = slugId(p), existing = ST.clients.find(c => c.id === id);
  const rec = existing || { id, name: clientName(p), receivedAt: new Date().toISOString(), submittedAt: p.submittedAt || null, payload: p, brief: null };
  if (!existing){
    ST.clients.unshift(rec);
    if (ST.db){ try { const { id:_, ...doc } = rec; doc.payload = stripImages(p); await ST.db.collection("clients").doc(id).set(doc); } catch(e){} }
  }
  ST.current = rec; ST.tab = rec.brief ? "brief" : "answers"; drawClients(); drawDetail();
}
function drawClients(){
  const box = $("#clients"); if (!box) return;
  if (!ST.clients.length){ box.innerHTML = `<p class="muted">${ST.db ? "No responses yet. Paste a code above to add your first client." : "Responses you open will show here for this visit."}</p>`; return; }
  box.innerHTML = "";
  ST.clients.forEach(c => {
    const b = document.createElement("button"); b.type = "button"; b.className = "client";
    b.setAttribute("aria-current", ST.current && ST.current.id === c.id ? "true" : "false");
    const d = new Date(c.submittedAt || c.receivedAt);
    b.innerHTML = `<span class="av">${esc((c.name || "?").trim().charAt(0).toUpperCase())}</span><span style="min-width:0"><span class="nm">${esc(c.name)}</span><span class="dt">${isNaN(d) ? "" : d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})}</span></span><span class="pill${c.brief ? " ok" : ""}">${c.brief ? "brief ready" : "new"}</span>`;
    b.onclick = () => { ST.current = c; ST.tab = c.brief ? "brief" : "answers"; drawClients(); drawDetail(); };
    box.appendChild(b);
  });
}
function drawDetail(){
  const el = $("#detail"), c = ST.current; if (!el || !c) return;
  el.innerHTML = `<div class="st-head" style="margin-bottom:12px"><div><span class="tag">client</span><h1 style="font-size:1.8rem">${esc(c.name)}</h1></div>
    <div class="st-actions" style="margin:0">
      <button class="btn sm pink" id="gen" ${ST.sample ? "" : "disabled"}>${c.brief ? "Regenerate brief" : "Create creative brief ✨"}</button>
      ${ST.downloads ? `<button class="btn sm soft" id="dlJson">Answers (.json)</button>${c.brief ? `<button class="btn sm soft" id="dlBrief">Brief (.html)</button>` : ""}` : ""}
      ${ST.db ? `<button class="link" id="del">Remove</button>` : ""}
    </div></div>
    ${ST.sample ? "" : `<p class="muted">Creating briefs needs this page open in claude.ai while you're signed in.</p>`}
    <p class="err" id="detErr" hidden></p>
    <div class="tabs" role="tablist"><button class="tab" role="tab" data-t="brief" aria-selected="${ST.tab === "brief"}">Creative brief</button><button class="tab" role="tab" data-t="answers" aria-selected="${ST.tab === "answers"}">Their answers</button></div>
    <div id="tabBody"></div>`;
  el.querySelectorAll(".tab").forEach(t => t.onclick = () => { ST.tab = t.dataset.t; drawDetail(); });
  const body = el.querySelector("#tabBody");
  if (ST.tab === "answers") body.appendChild(answersView(c.payload));
  else if (ST.busy) body.innerHTML = `<div class="loading"><div class="dots"><i></i><i></i><i></i></div><b style="font-family:var(--display);font-weight:400;font-size:1.4rem;color:var(--plum)">Reading between the lines…</b><span class="muted">Turning ${esc(c.name)}'s answers into a creative brief. This takes about a minute.</span></div>`;
  else if (c.brief) body.appendChild(briefView(c));
  else body.innerHTML = `<div class="empty"><b>No brief yet</b>Tap "Create creative brief" and I'll interpret ${esc(c.name)}'s answers: what they said, what it suggests, and where to take the design.</div>`;
  const gen = el.querySelector("#gen"); if (gen) gen.onclick = () => makeBrief(c);
  const dj = el.querySelector("#dlJson"); if (dj) dj.onclick = () => saveFile(`${c.id}-answers.json`, JSON.stringify(c.payload, null, 2));
  const dbf = el.querySelector("#dlBrief"); if (dbf) dbf.onclick = () => saveFile(`${c.id}-creative-brief.html`, briefDoc(c));
  const del = el.querySelector("#del");
  if (del) del.onclick = () => {
    del.outerHTML = `<span class="muted">Remove ${esc(c.name)}?</span><button class="link" id="delYes" style="color:#A3263E">Yes, remove</button><button class="link" id="delNo">Keep</button>`;
    el.querySelector("#delNo").onclick = drawDetail;
    el.querySelector("#delYes").onclick = async () => { try { await ST.db.collection("clients").doc(c.id).delete(); } catch(e){} ST.clients = ST.clients.filter(x => x.id !== c.id); ST.current = null; drawClients(); $("#detail").innerHTML = `<div class="empty"><b>Removed</b>Pick another client, or paste a new code.</div>`; };
  };
}
async function saveFile(filename, data){
  const err = $("#detErr");
  try { await ST.downloads.save({ filename, data }); }
  catch(e){ if (e && e.code !== "declined"){ err.textContent = "That file couldn't be saved from this view."; err.hidden = false; } }
}
async function makeBrief(c){
  if (ST.busy || !ST.sample) return;
  ST.busy = true; ST.tab = "brief"; drawDetail();
  try {
    let tier = "default";
    try { const lim = await ST.sample.limits(); if (lim && lim.modelTiers && lim.modelTiers.includes("complex")) tier = "complex"; } catch(e){}
    const brief = await ST.sample.json(briefPrompt(c.payload), { modelTier: tier, cache:false });
    if (!brief || !Array.isArray(brief.sections)) throw { code:"invalid_json" };
    brief.createdAt = new Date().toISOString();
    c.brief = brief;
    if (ST.db){ try { await ST.db.collection("clients").doc(c.id).update({ brief }); } catch(e){} }
    ST.busy = false; drawClients(); drawDetail();
  } catch(e){
    ST.busy = false; drawDetail();
    const err = $("#detErr");
    err.textContent = ({ not_granted:"Allow this page to ask Claude, then try again.", rate_limited:"You've hit a usage limit for now. Try again in a little while.", invalid_json:"The brief came back garbled. Tap Create again." })[e && e.code] || "The brief couldn't be created just now. Try again in a moment.";
    err.hidden = false;
  }
}
const hexOk = h => /^#[0-9a-f]{6}$/i.test(h || "");
function briefView(c){
  const b = c.brief, w = document.createElement("div"); w.className = "brief";
  const pal = (b.palette || []).filter(x => hexOk(x.hex));
  w.innerHTML = `<div class="hero"><p class="who">${esc(c.name)}</p>
      <div class="adj">${(b.adjectives || []).slice(0,3).map(a => `<span>${esc(a)}</span>`).join("")}</div>
      ${pal.length ? `<div class="palette">${pal.map(x => `<div><i style="background:${x.hex}"></i><span><b>${esc(x.name)}</b>${esc(x.hex.toUpperCase())} · ${esc(x.role || "")}</span></div>`).join("")}</div>` : ""}
      ${b.typography ? `<p style="margin:14px 0 0"><b>Type:</b> ${esc(b.typography.display)} for headings, ${esc(b.typography.body)} for text${b.typography.accent ? `, ${esc(b.typography.accent)} for accents` : ""}. <span class="muted">${esc(b.typography.why || "")}</span></p>` : ""}
    </div>
    <div class="legend"><span><i style="background:#CDBBA7"></i>They said (their own answers)</span><span><i style="background:#A897D6"></i>Our read (interpretation)</span></div>`;
  BRIEF_SECTIONS.forEach(([key, title]) => {
    const s = (b.sections || []).find(x => x.key === key); if (!s) return;
    const sec = document.createElement("div"); sec.className = "sec";
    sec.innerHTML = `<h3>${esc(title)}</h3><div class="cols">
      <div class="said"><h4>They said</h4>${(s.said || []).length ? `<ul>${s.said.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<p class="muted" style="margin:0">Nothing direct on this.</p>`}</div>
      <div class="read"><h4>Our read</h4><p>${esc(s.read || "")}</p>${(s.ideas || []).length ? `<ul>${s.ideas.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}</div></div>`;
    w.appendChild(sec);
  });
  if ((b.concepts || []).length){
    const sec = document.createElement("div"); sec.className = "sec";
    sec.innerHTML = `<h3>Three website concepts</h3><div class="concepts">${b.concepts.slice(0,3).map(k => `<div class="concept"><b>${esc(k.name)}</b><p>${esc(k.pitch)}</p>${k.signature_moment ? `<small>★ ${esc(k.signature_moment)}</small>` : ""}</div>`).join("")}</div>`;
    w.appendChild(sec);
  }
  if (b.unexpected && b.unexpected.idea){
    const sec = document.createElement("div"); sec.className = "sec";
    sec.innerHTML = `<h3>One unexpected idea they'll love</h3><div class="surprise"><b>${esc(b.unexpected.idea)}</b><p style="margin:6px 0 0">${esc(b.unexpected.why || "")}</p></div>`;
    w.appendChild(sec);
  }
  return w;
}
function answersView(p){
  const w = document.createElement("div");
  CHAPTERS.forEach(ch => {
    const box = document.createElement("div"); box.className = "ans-ch"; box.innerHTML = `<h3>${ch.emoji} ${esc(ch.title)}</h3>`;
    SCREENS_DEF.filter(s => s.ch === ch.id).forEach(s => s.qs.forEach(q => {
      const a = (p.answers || {})[q.id];
      const h = a && !a.skipped ? fmtHTML(q, a.answer) : null;
      const it = document.createElement("div"); it.className = "ans";
      it.innerHTML = `<div class="aq">${esc(a ? a.question : q.q.replace("{name}", p.name || ""))}</div><div class="aa${h ? "" : " skip"}">${h || "Skipped"}</div>${a && a.images ? a.images.map(im => `<img alt="${esc(im.name)}" src="${im.dataUrl}">`).join("") : ""}`;
      box.appendChild(it);
    }));
    w.appendChild(box);
  });
  return w;
}
function briefDoc(c){
  const css = [...document.querySelectorAll("style")].map(s => s.textContent).join("\n");
  const brief = briefView(c).outerHTML, answers = answersView(c.payload).outerHTML;
  return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creative brief · ${esc(c.name)}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;600;700&family=Caveat:wght@700&display=swap"><style>${css}
body{padding:24px}.wrapdoc{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:20px}</style></head><body><div class="wrapdoc">
<div class="st-head"><div><span class="tag">creative brief · internal</span><h1>${esc(c.name)}</h1></div><span class="muted">Created ${new Date(c.brief.createdAt || Date.now()).toLocaleDateString()}</span></div>
<section class="panel">${brief}</section><section class="panel"><h2>Their original answers</h2>${answers}</section></div></body></html>`;
}

/* =========================================================================
   BOOT
   ========================================================================= */
function route(){
  if (location.hash === "#studio"){ studioInit(); return; }
  if (ST.unsub){ try { ST.unsub(); } catch(e){} ST.unsub = null; }
  $("#app").classList.remove("studio"); document.title = "What's Your Website Mood?";
  const d = load(); if (d && d.submittedAt){ state = d; state.i = SCREENS.length - 1; } else if (d){ state = d; state.i = 0; }
  render();
}
addEventListener("hashchange", route);
route();
/* owner-only shortcut to the studio */
if (window.claude && claude.use) claude.use("user").then(async u => {
  let ok = false; try { ok = !!u && ((await u.isOwner()) || (await u.canEdit())); } catch(e){}
  if (!ok) return;
  const a = document.createElement("a"); a.className = "studio-chip"; a.href = "#studio"; a.textContent = "🎨 Studio"; document.body.appendChild(a);
  addEventListener("hashchange", () => a.hidden = location.hash === "#studio"); a.hidden = location.hash === "#studio";
}).catch(() => {});
</script>
